[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-assistant"
version = "0.1.0"
description = "Local Windows PC Operator and Assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "psutil>=5.9.0",
    "pyyaml>=6.0",
]

[project.scripts]
assistant = "assistant.ui.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["assistant*"]
